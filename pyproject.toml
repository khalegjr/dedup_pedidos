[project]
name = "dedup-pedidos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Júnior Souza - Khaled", email = "junior.souza@ti9.com.br" }
]
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "reportlab>=5.0.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
dedup-pedidos = "dedup_pedidos:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
