[project]
name = "dedup-pedidos"
version = "0.1.0"
description = "CLI de diagnóstico e deduplicação transacional de pedidos"
readme = "README.md"
authors = [
    { name = "Júnior Souza - Khaled", email = "junior.souza@ti9.com.br" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0.53",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
dedup-app = "dedup_pedidos.main:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
